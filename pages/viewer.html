<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DevOps Learning Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body{
      background:#f4f4f4;
      margin:0;
      padding:40px;
      font-family:Arial, sans-serif;
    }

    .container{
      max-width:1000px;
      margin:auto;
      background:white;
      padding:40px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    img{
      max-width:100%;
    }

    pre{
      background:#111827;
      color:white;
      padding:15px;
      overflow:auto;
      border-radius:8px;
    }

    code{
      background:#eee;
      padding:2px 5px;
      border-radius:4px;
    }

    a{
      color:#2563eb;
    }
  </style>
</head>

<body>

  <div class="container" id="content">
    Loading...
  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const file = params.get("file");

    fetch(file)
      .then(response => response.text())
      .then(text => {
        document.getElementById("content").innerHTML =
          marked.parse(text);
      })
      .catch(error => {
        document.getElementById("content").innerHTML =
          "<h2>README not found</h2>";
      });

  </script>

</body>
</html>
