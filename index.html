<!DOCTYPE html>
<html>
<head>
    <title>DevOps Learning Hub</title>
    <style>
        body{
            font-family: Arial;
            background:#0f172a;
            color:white;
            padding:40px;
        }

        h1{
            color:#38bdf8;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:10px;
            transition:0.3s;
        }

        .card:hover{
            background:#334155;
            transform:scale(1.03);
        }

        a{
            color:white;
            text-decoration:none;
        }
    </style>
</head>

<body>

<h1>🚀 DevOps Learning Hub</h1>

<p>
Complete DevOps, Cloud, Kubernetes, Linux, Networking, CI/CD, and Infrastructure learning repository.
</p>

<div class="container">

<div class="card"><a href="#">Linux</a></div>
<div class="card"><a href="#">Docker</a></div>
<div class="card"><a href="#">Kubernetes</a></div>
<div class="card"><a href="#">Terraform</a></div>
<div class="card"><a href="#">Ansible</a></div>
<div class="card"><a href="#">GitOps</a></div>
<div class="card"><a href="#">Networking</a></div>
<div class="card"><a href="#">CI-CD Pipelines</a></div>
<div class="card"><a href="#">Observability</a></div>
<div class="card"><a href="#">Cloud Platforms</a></div>

</div>

</body>
</html>
